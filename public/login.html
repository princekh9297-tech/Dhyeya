<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DHYEYA — Secure Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080a0d;color:#eef2f6;font-family:Inter,system-ui,sans-serif}.box{width:min(420px,90vw);padding:32px;border:1px solid #252b34;border-radius:24px;background:#101419;box-shadow:0 30px 90px #0008}.k{font-size:10px;letter-spacing:.18em;color:#c9a45c;font-weight:900}.logo{font-size:24px;font-weight:950;letter-spacing:.18em;margin-top:5px}h1{margin:12px 0 6px}p{color:#8e98a5;font-size:13px;line-height:1.6}input{width:100%;box-sizing:border-box;margin-top:10px;padding:13px;border-radius:11px;border:1px solid #2b323d;background:#0b0f13;color:white}button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:11px;background:#c9a45c;color:#101010;font-weight:900;cursor:pointer}.admin{background:#151b22;color:#e8d39f;border:1px solid #5a4a2a}.err{min-height:18px;color:#ff9ca1;font-size:12px;margin-top:10px}</style></head><body><main class="box"><div class="k">SECURE STUDENT ACCESS</div><div class="logo">DHYEYA</div><h1>Welcome back.</h1><p>Use the Student ID and password issued by DHYEYA Admin.</p><input id="id" placeholder="Student ID / Username / Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="login">Login to DHYEYA →</button><button class="admin" id="admin">🔐 Admin Login</button><div class="err" id="err"></div></main><script>const $=id=>document.getElementById(id);async function login(){ $('err').textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:$('id').value.trim(),password:$('pw').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');if(d.user.role==='admin'){await fetch('/api/auth/logout',{method:'POST'});throw Error('Use Admin Login for administrator accounts.')}location.replace('/')}catch(e){$('err').textContent=e.message}}$('login').onclick=login;$('pw').onkeydown=e=>{if(e.key==='Enter')login()};$('admin').onclick=async()=>{const id=prompt('Admin username / email');if(!id)return;const pw=prompt('Admin password');if(!pw)return;try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:id,password:pw})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');if(d.user.role!=='admin'){await fetch('/api/auth/logout',{method:'POST'});throw Error('This account is not an administrator.')}location.replace('/')}catch(e){$('err').textContent=e.message}}</script></body></html>
