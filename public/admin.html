<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DHYEYA — Admin Console</title><style>body{margin:0;background:#080a0d;color:#eef2f6;font-family:Inter,system-ui,sans-serif;min-height:100vh}.head{padding:18px 22px;border-bottom:1px solid #252b34;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;letter-spacing:.18em}.sub{color:#8e98a5;font-size:12px}.wrap{padding:20px;max-width:1200px;margin:auto}.panel{background:#101419;border:1px solid #252b34;border-radius:18px;padding:18px}button{padding:10px 13px;border-radius:10px;border:1px solid #3a424e;background:#151b22;color:#eef2f6;font-weight:800;cursor:pointer}.gold{background:#c9a45c;color:#111;border-color:#c9a45c}.danger{background:#351a1e;color:#ffb0b5}.status{padding:5px 8px;border-radius:99px;font-size:10px}.active{background:#173a29;color:#8ee0b1}.blocked{background:#3d1d20;color:#ff9ca1}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:11px 8px;border-bottom:1px solid #252b34;text-align:left}.table th{font-size:10px;color:#7f8995;text-transform:uppercase}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.kpi{background:#0b0f13;border:1px solid #252b34;border-radius:14px;padding:14px}.kpi small{color:#7f8995}.kpi b{display:block;font-size:24px;margin-top:4px}@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.table{min-width:850px}.panel{overflow:auto}}</style></head><body><header class="head"><div><div class="brand">DHYEYA</div><div class="sub">Administrator Control Center</div></div><button id="logout" class="danger">Logout</button></header><main class="wrap"><div id="adminMount"></div></main><script src="/nexus-foundation.js?v=4.3.0"></script><script>document.addEventListener('DOMContentLoaded',async()=>{try{const d=await window.NexusFoundation.api('/auth/me');if(d.user.role!=='admin')return location.replace('/student');window.DHYEYAAdmin.openConsole(d.user)}catch(e){location.replace('/')}});document.getElementById('logout').onclick=async()=>{await window.NexusFoundation.api('/auth/logout',{method:'POST'});location.replace('/')};</script></body></html>
